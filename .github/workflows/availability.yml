name: Refresh availability

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run availability:refresh
      - name: Update bundled snapshot for Vercel deploys
        run: cp .cache/availability.json src/data/availability.snapshot.json
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/availability.snapshot.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -m "chore: refresh availability snapshot"
          git push
