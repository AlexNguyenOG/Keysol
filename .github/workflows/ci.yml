name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run audit:ci

      - name: Verify production env requirements
        env:
          AUTH_SECRET: ci-test-auth-secret
        run: NODE_ENV=production node scripts/check-production-env.mjs

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
